# ─────────────────────────────────────────────────────────────────────────────
# NexusEmu reverse proxy for AWS — wildcard *.savestate.co.za + TLS termination.
#
# The Node app does its own per-tenant subdomain routing (it reads the Host /
# X-Forwarded-Host header and maps <user>.savestate.co.za to a tenant), so this
# config must NOT enumerate subdomains. It terminates TLS, preserves the
# original Host, and proxies everything to the container.
# ─────────────────────────────────────────────────────────────────────────────
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;          # container logging: stderr, not a file
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $host "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  75s;

    # ROM and video uploads are large; 0 disables the body-size ceiling and
    # lets the app enforce its own limits.
    client_max_body_size 0;
    client_body_timeout  300s;

    # The app already gzips its JSON; re-compressing media wastes CPU.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nexus_app {
        # "nexus" is the compose service name; on ECS point this at the
        # service-discovery name or the ALB target instead.
        server nexus:3000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    # ── Port 80: ACME challenges, everything else redirected ─────────────────
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name savestate.co.za *.savestate.co.za;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Port 443: wildcard TLS, proxy to the app ─────────────────────────────
    server {
        listen      443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        # One wildcard cert serves the apex and every tenant subdomain.
        # *.savestate.co.za does NOT cover the apex, so the cert must carry
        # both names (deploy-aws.sh requests them together).
        server_name savestate.co.za *.savestate.co.za;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Health check straight through, never cached or redirected.
        location = /api/health {
            proxy_pass http://nexus_app;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            proxy_pass http://nexus_app;
            proxy_http_version 1.1;

            # The tenant router depends on these three being accurate.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            # WebSockets: /ws/coop (co-op hub) and the watch-party socket.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Range-streaming ROMs and video: buffering would defeat HTTP 206
            # and stall playback while nginx filled a temp file on disk.
            proxy_buffering  off;
            proxy_request_buffering off;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # Long media streams must not be cut at the default 60s.
            proxy_connect_timeout 30s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }
    }
}
