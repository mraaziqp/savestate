# Deploy:  npx wrangler deploy
# The route puts this Worker in front of every request to the domain; the happy
# path is a pass-through, so normal traffic is unaffected.
name = "savestate-failover"
main = "savestate-failover.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "savestate.co.za/*", zone_name = "savestate.co.za" },
  { pattern = "*.savestate.co.za/*", zone_name = "savestate.co.za" },
]

# Failover order when the home host is down (see savestate-failover.js):
#   STANDBY_ORIGIN  - the AWS App Runner service; full app, API included.
#                     Set it to the stack's ServiceUrl output after
#                     `bash scripts/deploy-aws-serverless.sh`. Left unset, the
#                     Worker skips straight to the static shell.
#   FALLBACK_ORIGIN - Amplify; static frontend only, page loads only.
[vars]
FALLBACK_ORIGIN = "https://main.d1o153osqs5hc7.amplifyapp.com"
# STANDBY_ORIGIN = "https://<id>.<region>.awsapprunner.com"
