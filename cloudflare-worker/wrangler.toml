# Deploy:  npx wrangler deploy
# The route puts this Worker in front of every request to the domain; the happy
# path is a pass-through, so normal traffic is unaffected.
name = "savestate-failover"
main = "savestate-failover.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "savestate.co.za/*", zone_name = "savestate.co.za" },
  { pattern = "*.savestate.co.za/*", zone_name = "savestate.co.za" },
]

# The site runs ONLY from the home host. When it is down, the Worker answers
# with its built-in offline page (and a JSON 503 for /api/*); nothing is sent
# to AWS. The Worker still supports two optional fallbacks, left unset on
# purpose:
#   STANDBY_ORIGIN  - a second full copy of the app (e.g. AWS App Runner)
#   FALLBACK_ORIGIN - a static copy of the frontend (e.g. Amplify)
# [vars]
# STANDBY_ORIGIN = "https://..."
# FALLBACK_ORIGIN = "https://..."
