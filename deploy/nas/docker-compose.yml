# SaveState on a NAS or any Linux box with Docker: the app and its own
# database, nothing in the cloud. install.sh writes .env next to this file
# (passwords, your folders) and runs `docker compose up -d --build`.
#
#   http://<this machine>:3000      the first account made there owns the host
#
# Your folders are mounted read-only: SaveState never changes or deletes
# your films, music or games. Uploads and settings live in the "data" volume.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savestate
      POSTGRES_DB: savestate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run install.sh first}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savestate -d savestate"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: savestate:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://savestate:${DB_PASSWORD}@db:5432/savestate
      NEXUS_DB_SSL: "0"
      JWT_SECRET: ${JWT_SECRET:?run install.sh first}
      NEXUS_DATA_DIR: /data
      # The Dockerfile's defaults are for the cloud image; a NAS scans and
      # plays its own disks.
      NEXUS_CLOUD_FIRST: "0"
      NEXUS_STREAM_ONLY: "0"
      NEXUS_DISABLE_LOCAL_SCAN: "0"
      NEXUS_DISABLE_HW_TRANSCODE: "1"
      NEXUS_MEDIA_ROOT: /library/media
      NEXUS_MUSIC_ROOTS: /library/music
      VAULT_ROOT: /library/games
      NEXUS_PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - data:/data
      - ${MEDIA_DIR:-./empty}:/library/media:ro
      - ${MUSIC_DIR:-./empty}:/library/music:ro
      - ${GAMES_DIR:-./empty}:/library/games:ro

volumes:
  db:
  data:
