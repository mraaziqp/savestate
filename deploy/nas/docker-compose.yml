# SaveState on a NAS: the app, Cloudflare tunnel (savestate.co.za), and database.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savestate
      POSTGRES_DB: savestate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-savestate_nas_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savestate -d savestate"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: savestate:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://savestate:${DB_PASSWORD:-savestate_nas_password}@db:5432/savestate}
      NEXUS_DB_SSL: "0"
      JWT_SECRET: ${JWT_SECRET}
      NEXUS_DATA_DIR: /data
      NEXUS_CLOUD_FIRST: "0"
      NEXUS_STREAM_ONLY: "0"
      NEXUS_DISABLE_LOCAL_SCAN: "0"
      NEXUS_DISABLE_HW_TRANSCODE: "1"
      NEXUS_MEDIA_ROOT: /library/media
      NEXUS_MUSIC_ROOTS: /library/music
      VAULT_ROOT: /library/games
      NEXUS_PUBLIC_URL: ${PUBLIC_URL:-https://savestate.co.za}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-/share/Multimedia}:/library/media:ro
      - ${MUSIC_DIR:-/share/Multimedia/Music}:/library/music:ro
      - ${GAMES_DIR:-/share/Public/Games}:/library/games:ro

  # Cloudflare Named Tunnel: routes savestate.co.za directly to this container
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app

volumes:
  db-data:
