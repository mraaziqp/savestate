[package]
name = "savestate-engine"
description = "SaveState's own libretro host: loads cores and runs games inside SaveState"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "savestate_engine"
path = "src/lib.rs"

[[bin]]
name = "savestate-engine"
path = "src/main.rs"

# Pure-Rust dependencies only: the engine builds without a C compiler.
[dependencies]
libretro-sys = { path = "../libretro-sys" }
libloading = "0.8"
png = "0.17"
ureq = { version = "2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Windows APIs for the capture bridge (Phase 6). 0.58 links through prebuilt
# import libraries (windows-targets 0.52), which the GNU toolchain can use;
# later versions need raw-dylib (see SAVESTATE_ENGINE_SPEC.md 1).
windows = { version = "=0.58.0", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "implement",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The app calls the player through JNI (android/jni_api.rs).
jni = { version = "0.21", default-features = false }

[target.'cfg(not(windows))'.dependencies]
# Android and Linux: ureq's own TLS (rustls).
ureq = { version = "2", default-features = false, features = ["tls"] }
