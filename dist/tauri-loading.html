<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NexusEmu</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a14;
        color: #e7efff;
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(77, 124, 255, 0.25);
        border-top-color: #4d7cff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      p {
        font-size: 12px;
        color: #9fb0d4;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <p>Starting NexusEmu&hellip;</p>
    </div>
  </body>
</html>
