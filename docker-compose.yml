# NexusEmu — AWS EC2 deployment (docker compose v2).
#
# For ECS Fargate use the Dockerfile directly with a task definition instead;
# this file is the single-EC2-host path, which is the cheaper starting point
# and the one deploy-aws.sh drives.
services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NEXUS_IMAGE:-nexusemu:latest}
    container_name: nexus-server
    restart: unless-stopped
    # Never published directly — nginx terminates TLS and proxies in.
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXUS_CLOUD_FIRST: "1"
      NEXUS_STREAM_ONLY: "1"
      NEXUS_DISABLE_LOCAL_SCAN: "1"
    # Stateless: the only writable paths are in-memory and vanish on restart.
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks: [nexusnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Wildcard cert for *.savestate.co.za — see deploy-aws.sh for issuance.
      - ./certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [nexusnet]

volumes:
  certbot-webroot:

networks:
  nexusnet:
    driver: bridge
